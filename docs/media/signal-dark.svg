<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker><linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>
<rect x="258" y="24" width="970" height="208" rx="20" fill="rgba(244,63,94,0.04)" stroke="rgba(244,63,94,0.5)" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="276" y="51" font-size="14" font-weight="700" letter-spacing="0.6" fill="#e6edf3">M55 · PER SAMPLE</text><text x="462" y="51" font-size="13" fill="#8b949e">every 4 ms, 250 Hz</text><text x="1210" y="51" font-size="13" text-anchor="end" fill="#8b949e">≈ 250 cycles = 0.6 µs at 400 MHz</text>
<rect x="12" y="294" width="970" height="208" rx="20" fill="rgba(234,120,40,0.04)" stroke="rgba(234,120,40,0.5)" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="146.0" y="321" font-size="14" font-weight="700" letter-spacing="0.6" fill="#e6edf3">M55 · PER WINDOW</text><text x="332.0" y="321" font-size="13" fill="#8b949e">once per trial (or every 256 ms)</text><text x="964" y="321" font-size="13" text-anchor="end" fill="#8b949e">≈ 100 k cycles = 0.25 ms at 400 MHz</text>
