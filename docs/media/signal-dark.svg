<rect x="762" y="70" width="208" height="150" rx="16" fill="rgba(244,63,94,0.18)" stroke="rgba(244,63,94,0.85)" stroke-width="1.5"/><rect x="763.5" y="71.5" width="205" height="67.5" rx="14.5" fill="url(#sheen)"/><circle cx="792" cy="100" r="14" fill="rgba(244,63,94,0.4)" stroke="rgba(244,63,94,0.85)" stroke-width="1.2"/><text x="792" y="105" font-size="14" font-weight="800" text-anchor="middle" fill="#e6edf3">3</text><text x="816" y="106" font-size="15" font-weight="700" letter-spacing="0.4" fill="#e6edf3">BAND-PASS</text><rect x="776" y="126" width="180" height="30" rx="8" fill="rgba(244,63,94,0.24)"/><text x="866.0" y="146" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#c9d1d9">7–30 Hz · 4 biquads</text><text x="778" y="180" font-size="12.5" fill="#8b949e">causal, filter state kept;</text><text x="778" y="198" font-size="12.5" fill="#8b949e">keeps mu and beta rhythms</text>
<rect x="1008" y="70" width="208" height="150" rx="16" fill="rgba(244,63,94,0.18)" stroke="rgba(244,63,94,0.85)" stroke-width="1.5"/><rect x="1009.5" y="71.5" width="205" height="67.5" rx="14.5" fill="url(#sheen)"/><circle cx="1038" cy="100" r="14" fill="rgba(244,63,94,0.4)" stroke="rgba(244,63,94,0.85)" stroke-width="1.2"/><text x="1038" y="105" font-size="14" font-weight="800" text-anchor="middle" fill="#e6edf3">4</text><text x="1062" y="106" font-size="15" font-weight="700" letter-spacing="0.4" fill="#e6edf3">DECIMATE</text><rect x="1022" y="126" width="180" height="30" rx="8" fill="rgba(244,63,94,0.24)"/><text x="1112.0" y="146" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#c9d1d9">keep every 2nd sample</text><text x="1024" y="180" font-size="12.5" fill="#8b949e">250 Hz → 125 Hz;</text><text x="1024" y="198" font-size="12.5" fill="#8b949e">band-pass is the anti-alias</text>
