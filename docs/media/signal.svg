<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/></marker><linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.65"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>
<rect x="258" y="24" width="970" height="208" rx="20" fill="rgba(244,63,94,0.04)" stroke="rgba(244,63,94,0.5)" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="276" y="51" font-size="14" font-weight="700" letter-spacing="0.6" fill="#2b2b2b">M55 · PER SAMPLE</text><text x="462" y="51" font-size="13" fill="#6b6b6b">every 4 ms, 250 Hz</text><text x="1210" y="51" font-size="13" text-anchor="end" fill="#6b6b6b">≈ 250 cycles = 0.6 µs at 400 MHz</text>
<rect x="12" y="294" width="970" height="208" rx="20" fill="rgba(234,120,40,0.04)" stroke="rgba(234,120,40,0.5)" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="146.0" y="321" font-size="14" font-weight="700" letter-spacing="0.6" fill="#2b2b2b">M55 · PER WINDOW</text><text x="332.0" y="321" font-size="13" fill="#6b6b6b">once per trial (or every 256 ms)</text><text x="964" y="321" font-size="13" text-anchor="end" fill="#6b6b6b">≈ 100 k cycles = 0.25 ms at 400 MHz</text>
<rect x="24" y="70" width="208" height="150" rx="16" fill="rgba(6,182,212,0.13)" stroke="rgba(6,182,212,0.75)" stroke-width="1.5"/><rect x="25.5" y="71.5" width="205" height="67.5" rx="14.5" fill="url(#sheen)"/><g transform="translate(41,87) scale(1.1)" fill="none" stroke="#4b4b4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12h3l2-5 3 10 3-13 3 11 2-3h6" stroke-dasharray="56 56" ><animate attributeName="stroke-dashoffset" values="0;-112" dur="2.4s" repeatCount="indefinite"/></path></g><text x="78" y="106" font-size="15" font-weight="700" letter-spacing="0.4" fill="#2b2b2b">UART IN</text><rect x="38" y="126" width="180" height="30" rx="8" fill="rgba(6,182,212,0.17)"/><text x="128.0" y="146" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3a3a3a">22 × int16 counts</text><text x="40" y="180" font-size="12.5" fill="#6b6b6b">one frame per sample, 250 Hz</text><text x="40" y="198" font-size="12.5" fill="#6b6b6b">from bridge.py</text>
<rect x="270" y="70" width="208" height="150" rx="16" fill="rgba(244,63,94,0.13)" stroke="rgba(244,63,94,0.75)" stroke-width="1.5"/><rect x="271.5" y="71.5" width="205" height="67.5" rx="14.5" fill="url(#sheen)"/><circle cx="300" cy="100" r="14" fill="rgba(244,63,94,0.28)" stroke="rgba(244,63,94,0.75)" stroke-width="1.2"/><text x="300" y="105" font-size="14" font-weight="800" text-anchor="middle" fill="#2b2b2b">1</text><text x="324" y="106" font-size="15" font-weight="700" letter-spacing="0.4" fill="#2b2b2b">DECODE</text><rect x="284" y="126" width="180" height="30" rx="8" fill="rgba(244,63,94,0.17)"/><text x="374.0" y="146" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3a3a3a">µV = count × 0.0488</text><text x="286" y="180" font-size="12.5" fill="#6b6b6b">exact BCI IV 2a ADC step,</text><text x="286" y="198" font-size="12.5" fill="#6b6b6b">lossless</text>
<rect x="516" y="70" width="208" height="150" rx="16" fill="rgba(244,63,94,0.13)" stroke="rgba(244,63,94,0.75)" stroke-width="1.5"/><rect x="517.5" y="71.5" width="205" height="67.5" rx="14.5" fill="url(#sheen)"/><circle cx="546" cy="100" r="14" fill="rgba(244,63,94,0.28)" stroke="rgba(244,63,94,0.75)" stroke-width="1.2"/><text x="546" y="105" font-size="14" font-weight="800" text-anchor="middle" fill="#2b2b2b">2</text><text x="570" y="106" font-size="15" font-weight="700" letter-spacing="0.4" fill="#2b2b2b">CAR</text><rect x="530" y="126" width="180" height="30" rx="8" fill="rgba(244,63,94,0.17)"/><text x="620.0" y="146" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3a3a3a">x − mean of 22 ch</text><text x="532" y="180" font-size="12.5" fill="#6b6b6b">common average reference:</text><text x="532" y="198" font-size="12.5" fill="#6b6b6b">removes the shared reference</text>
<rect x="762" y="70" width="208" height="150" rx="16" fill="rgba(244,63,94,0.13)" stroke="rgba(244,63,94,0.75)" stroke-width="1.5"/><rect x="763.5" y="71.5" width="205" height="67.5" rx="14.5" fill="url(#sheen)"/><circle cx="792" cy="100" r="14" fill="rgba(244,63,94,0.28)" stroke="rgba(244,63,94,0.75)" stroke-width="1.2"/><text x="792" y="105" font-size="14" font-weight="800" text-anchor="middle" fill="#2b2b2b">3</text><text x="816" y="106" font-size="15" font-weight="700" letter-spacing="0.4" fill="#2b2b2b">BAND-PASS</text><rect x="776" y="126" width="180" height="30" rx="8" fill="rgba(244,63,94,0.17)"/><text x="866.0" y="146" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3a3a3a">7–30 Hz · 4 biquads</text><text x="778" y="180" font-size="12.5" fill="#6b6b6b">causal, filter state kept;</text><text x="778" y="198" font-size="12.5" fill="#6b6b6b">keeps mu and beta rhythms</text>
<rect x="1008" y="70" width="208" height="150" rx="16" fill="rgba(244,63,94,0.13)" stroke="rgba(244,63,94,0.75)" stroke-width="1.5"/><rect x="1009.5" y="71.5" width="205" height="67.5" rx="14.5" fill="url(#sheen)"/><circle cx="1038" cy="100" r="14" fill="rgba(244,63,94,0.28)" stroke="rgba(244,63,94,0.75)" stroke-width="1.2"/><text x="1038" y="105" font-size="14" font-weight="800" text-anchor="middle" fill="#2b2b2b">4</text><text x="1062" y="106" font-size="15" font-weight="700" letter-spacing="0.4" fill="#2b2b2b">DECIMATE</text><rect x="1022" y="126" width="180" height="30" rx="8" fill="rgba(244,63,94,0.17)"/><text x="1112.0" y="146" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3a3a3a">keep every 2nd sample</text><text x="1024" y="180" font-size="12.5" fill="#6b6b6b">250 Hz → 125 Hz;</text><text x="1024" y="198" font-size="12.5" fill="#6b6b6b">band-pass is the anti-alias</text>
